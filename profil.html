        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* BODY */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #dce7ff);
            color: #1a1a1a;
        }

        /* NAVBAR */
        nav {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 8px 20px;
            margin: 20px auto;
            width: fit-content;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: #3a4fff;
            font-weight: 500;
        }

        /* SECTION */
        .project {
            padding: 80px 20px;
        }

        /* CARD FORM */
        form {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(58, 79, 255, 0.1);
        }

        /* TITLE */
        h1 {
            font-family: 'Playfair Display', serif;
            color: #f5f5fa;
            margin-bottom: 10px;
        }

        /* INPUT */
        input,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #d0d7ff;
            margin-top: 5px;
            margin-bottom: 15px;
            outline: none;
            transition: 0.3s;
        }

        /* FOCUS EFFECT */
        input:focus,
        textarea:focus {
            border-color: #3a4fff;
            box-shadow: 0 0 0 3px rgba(58, 79, 255, 0.1);
        }

        /* LABEL */
        label {
            font-weight: 500;
            color: #555;
        }

        /* BUTTON */
        .button {
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #4facfe, #3a4fff);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        /* BUTTON HOVER */
        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(58, 79, 255, 0.2);
        }

        /* FOOTER */
        footer {
            background: #3a4fff;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        footer a {
            color: #fff;
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width:768px) {
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>

    <section class="project blue">
        <div class="container">
            <div class="row">
                <div class="col-sm">
                    <h1>Form Profil</h1>
                    <p>Fill in your personal information below, then click the save button to view your profile.</p>
                </div>
            </div>
            <div class="row">
                <div class="col-sm">
                    <form id="profilForm">
                        <ul>

                            <li>
                                <label for="alamat">Address</label><br>
                                <textarea id="alamat" name="alamat" rows="3" required></textarea>
                            </li>
                            <li>
                                <label for="hobi">Hobby</label><br>
                                <input type="text" id="hobi" name="hobi" required>
                            </li>
                            <li>
                                <label for="instagram">Instagram</label><br>
                                <input type="text" id="instagram" name="instagram" placeholder="@username" required>
                            </li>
                        </ul>
                        <button type="submit" class="button">Save</button>
                    </form>
                </div>
