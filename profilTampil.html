<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #eaf2ff, #dce7ff);
}

/* NAVBAR */
nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    padding: 8px 20px;
    border-radius: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

nav ul {
    display: flex;
    gap: 20px;
    list-style: none;
}

nav a {
    text-decoration: none;
    color: #3a4fff;
    font-weight: 500;
}

/* CARD */
.card {
    max-width: 600px;
    margin: 120px auto;
    background: white;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(58,79,255,0.1);
}

/* TITLE */
h1 {
    text-align: center;
    color: #3a4fff;
    margin-bottom: 25px;
}

/* DATA */
.data p {
    margin-bottom: 12px;
    color: #444;
    font-size: 15px;
}

/* LABEL */
.data strong {
    color: #3a4fff;
}

/* IG LINK */
#instagram {
    color: #3a4fff;
    text-decoration: none;
}

#instagram:hover {
    text-decoration: underline;
}

/* BUTTON */
.button {
    display: block;
    text-align: center;
    margin-top: 25px;
    padding: 12px;
    border-radius: 30px;
    background: linear-gradient(135deg, #4facfe, #3a4fff);
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(58,79,255,0.2);
}

/* EMPTY STATE */
.empty {
    text-align: center;
    color: #888;
}

</style>
</head>

<body>

<!-- NAVBAR -->
    <nav>
        <ul>
            <li><a href="contact.html">contact</a></li>
            <li><a href="journey.html">journey</a></li>
            <li><a href="experience.html">experience</a></li>
            <li><a href="index.html">Home</a></li>
            <li><a href="profil.html">profil</a></li>
            <li><a href="https://instagram.com/marianamrdn_" target="_blank">instagram</a></li>
            <li><a href="https://wa.me/082299543317">Whatsapp</a></li>
            <li><a href="profil.html">Isi Ulang</a></li>
        </ul>
    </nav>

<!-- CARD -->
<div class="card">
    <h1>Profil Saya</h1>

    <div class="data" id="dataProfil">
        <!-- DATA MUNCUL DI SINI -->
    </div>

    <a href="profil.html" class="button">← Kembali ke Form</a>
</div>

<script>

// ambil data
const nim = localStorage.getItem("nim");
const nama = localStorage.getItem("nama");
const alamat = localStorage.getItem("alamat");
const hobi = localStorage.getItem("hobi");
const instagram = localStorage.getItem("instagram");

const container = document.getElementById("dataProfil");

// kalau data kosong
if(!nim || !nama){
    container.innerHTML = `
        <p class="empty">Data belum diisi 😢</p>
    `;
} else {

    // format IG biar bisa diklik
    let igLink = "";
    if(instagram){
        const username = instagram.replace("@","");
        igLink = `<a id="instagram" href="https://instagram.com/${username}" target="_blank">@${username}</a>`;
    }

    container.innerHTML = `
        <p><strong>NIM:</strong> ${nim}</p>
        <p><strong>Nama:</strong> ${nama}</p>
        <p><strong>Alamat:</strong> ${alamat}</p>
        <p><strong>Hobi:</strong> ${hobi}</p>
        <p><strong>Instagram:</strong> ${igLink}</p>
    `;
}

</script>

</body>
</html>
