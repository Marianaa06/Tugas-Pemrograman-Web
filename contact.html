<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Saya</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display&display=swap"
        rel="stylesheet">

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* BODY */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #dce7ff);
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            z-index: 999;
        }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: #3a4fff;
            font-weight: 500;
        }

        /* CONTAINER */
        .container {
            max-width: 1000px;
            margin: 120px auto;
            padding: 20px;
        }

        /* WRAPPER */
        .contact-box {
            display: flex;
            gap: 40px;
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(58, 79, 255, 0.1);
        }

        /* LEFT */
        .contact-info {
            flex: 1;
        }

        .contact-info h1 {
            font-family: 'Playfair Display', serif;
            color: #3a4fff;
            margin-bottom: 15px;
        }

        .contact-info p {
            color: #555;
            margin-bottom: 20px;
        }

        /* SOCIAL */
        .social a {
            display: inline-block;
            margin-right: 10px;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #4facfe, #3a4fff);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            transition: 0.3s;
        }

        .social a:hover {
            transform: translateY(-3px);
        }

        /* FORM */
        .contact-form {
            flex: 1;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #d0d7ff;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #3a4fff;
        }

        /* BUTTON */
        .button {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #4facfe, #3a4fff);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(58, 79, 255, 0.2);
        }

        /* RESPONSIVE */
        @media (max-width:768px) {
            .contact-box {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav>

            <li><a href="https://wa.me/082299543317">Whatsapp</a></li>
        </ul>
    </nav>

    <div class="container">

        <div class="contact-box">

            <!-- KIRI -->
            <div class="contact-info">
                <h1>Contact Me</h1>
                <p>Please contact me through the form or social media below.</p>

                <div class="social">
                    <a href="https://instagram.com/marianamrdn_" target="_blank">📸 Instagram</a>
                    <a href="https://wa.me/082299543317">💼 Whatsapp</a>
                </div>
            </div>

            <!-- KANAN -->
            <div class="contact-form">
                <form action="https://formspree.io/f/xvzlwnyv" method="POST">

                    <input type="text" name="nama" placeholder="Nama" required>

                    <input type="email" name="email" placeholder="Email" required>

                    <textarea name="pesan" rows="5" placeholder="Pesan" required></textarea>

                    <button type="submit" class="button">
                        Send Message
                    </button>

                </form>
            </div>

        </div>

    </div>

</body>

</html>
